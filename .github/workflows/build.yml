name: Build AX8860 samples

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TOOLCHAIN_VERSION: 13.3.rel1
  TOOLCHAIN_ARCHIVE: arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
  TOOLCHAIN_SHA256: 322f0b4482fc0d9fa0bb468134841f08d8c554c54ff5aa29a13a7a24bf7e1eb5
  TOOLCHAIN_URL: https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/13.3.rel1/arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
  BSP_RELEASE_TAG: bsp
  BSP_ASSET: ax8860_arm64_glibc_axengine_dev.zip
  BSP_SHA256: ebbbb66065a57bdbb52d58cea93b32986dcfc4601c262161f7051a40dae00b3e

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache Arm GNU Toolchain
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          key: arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-linux-gnu

      - name: Install Arm GNU Toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$TOOLCHAIN_ARCHIVE"
          if [[ ! -f "$archive" ]]; then
            curl -fL --retry 5 --retry-delay 5 --connect-timeout 20 \
              -o "$archive" "$TOOLCHAIN_URL"
          fi
          echo "$TOOLCHAIN_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/arm-gnu-toolchain-${TOOLCHAIN_VERSION}-x86_64-aarch64-none-linux-gnu/bin" >> "$GITHUB_PATH"

      - name: Download AX8860 BSP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$BSP_ASSET"
          if ! output=$(gh release download "$BSP_RELEASE_TAG" \
              --repo ZHEQIUSHUI/ax-dsl-samples \
              --pattern "$BSP_ASSET" \
              --dir "$RUNNER_TEMP" \
              --clobber 2>&1); then
            echo "::error::BSP download failed: ${output}"
            exit 1
          fi
          actual_sha256=$(sha256sum "$archive" | cut -d' ' -f1)
          actual_size=$(stat -c %s "$archive")
          if [[ "$actual_sha256" != "$BSP_SHA256" ]]; then
            echo "::error::BSP checksum mismatch: expected=${BSP_SHA256} actual=${actual_sha256} size=${actual_size}"
            exit 1
          fi
          if ! unzip -q "$archive" -d "$RUNNER_TEMP/ax8860-bsp"; then
            echo "::error::BSP archive could not be extracted"
            exit 1
          fi
          if [[ ! -f "$RUNNER_TEMP/ax8860-bsp/arm64_glibc/include/ax_engine_api.h" ]]; then
            echo "::error::BSP archive does not contain arm64_glibc/include/ax_engine_api.h"
            exit 1
          fi
          echo "AX8860_BSP=$RUNNER_TEMP/ax8860-bsp/arm64_glibc" >> "$GITHUB_ENV"

      - name: Build with build.sh
        run: ./build.sh

      - name: Build with CMake
        run: |
          cmake \
            -S . \
            -B "$RUNNER_TEMP/build-cmake" \
            -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64-none-linux-gnu.toolchain.cmake \
            -DAX8860_BSP="$AX8860_BSP" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/build-cmake" --parallel

      - name: Verify executable architecture
        run: file build/ax_dsl_*
